[versions]
agp = "8.7.3"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
composeBom = "2024.12.01"
media3 = "1.8.0"
okhttp = "3.12.13"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.9.0"
material3 = "1.4.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
